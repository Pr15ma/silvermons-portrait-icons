plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modCompileOnly("com.cobblemon:fabric:${project.cobblemon_version}") { transitive = false }
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

